# Сборка и подпись релизов gate4ai-relay.
version: 2
project_name: gate4ai-relay
builds:
  - id: relay
    main: ./cmd/gate4ai-relay
    binary: gate4ai-relay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, docs/*]
checksum:
  name_template: checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
